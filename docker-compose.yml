services:
  crondock:
    build: .
    image: benny2168/crondock:latest
    container_name: crondock
    restart: unless-stopped
    ports:
      - "3900:8000"
    volumes:
      - /Users/benny2168/Dockers/crondock/data:/data
    environment:
      - TZ=America/Chicago
      - DATA_DIR=/data
      # ── Auth provider (Authentik) ─────────────────────────────────────────
      - AUTH_PROVIDER=oidc
      - LOGIN_PROVIDER_NAME=Authentik SSO
      - OIDC_CLIENT_ID=75b62448073fff0a11a266448ee9d3a9b36df787
      - OIDC_CLIENT_SECRET=lLCNKGLN7UB_eZiQ0L20vGM2iHkCPgy6MEqBL9uEMg43X8FhOEa4ChyDTxj-_PIM
      - OIDC_DISCOVERY_URL=https://auth.abraham16.com/application/o/crondock/.well-known/openid-configuration
      - OIDC_REDIRECT_URI=https://cron.abraham16.com/auth/callback
      # ── Session ───────────────────────────────────────────────────────────
      - SESSION_SECRET=76d2a63f17d652601113e968aca6f4d613ba55941b5ec98f34f777ed76ebda42
      - SESSION_COOKIE_NAME=crondock_session
      - SESSION_MAX_AGE_HOURS=24
    networks:
      - default
      - proxynet

networks:
  proxynet:
    external: true

