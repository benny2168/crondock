services:
  crondock:
    image: benny2168/crondock:latest
    container_name: crondock
    restart: unless-stopped
    ports:
      - "3901:8000"
    volumes:
      - /volume1/docker/crondock/data:/data
    environment:
      - TZ=America/Chicago
      - DATA_DIR=/data
      # ── Auth provider (Authentik) ─────────────────────────────────────────
      - AUTH_PROVIDER=oidc
      - LOGIN_PROVIDER_NAME=MTCD Login
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_DISCOVERY_URL=https://auth.server.mtcd.org/application/o/crondock/.well-known/openid-configuration
      - OIDC_REDIRECT_URI=https://cron.server.mtcd.org/auth/callback
      # ── Session ─────────────────────────────────────────────────────────
      - SESSION_SECRET=${SESSION_SECRET}
      - IAM_API_KEY=cd_qKGHxH9uPzHyJyV7PtbD9hpHUWuHC2Tq3P4iWIzANsA
      - SESSION_COOKIE_NAME=crondock_session
      - SESSION_MAX_AGE_HOURS=24
    networks:
      - npm

networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
