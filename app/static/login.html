<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CronDock — Sign In</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #080c18;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }

    /* Animated background */
    .bg {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(108,99,255,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(79,195,247,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(108,99,255,0.06) 0%, transparent 70%),
        #080c18;
    }

    /* Dot grid */
    .bg::before {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: #6c63ff; top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 300px; height: 300px; background: #4fc3f7; bottom: -80px; right: -80px; animation-delay: -4s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%       { transform: translate(30px, -30px) scale(1.05); }
    }

    /* Center layout */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    /* Card */
    .card {
      width: 100%; max-width: 400px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(108,99,255,0.15);
      animation: card-in 0.5s cubic-bezier(0.4,0,0.2,1) forwards;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #6c63ff, #4fc3f7);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(108,99,255,0.4);
      flex-shrink: 0;
    }

    .logo-text { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .logo-sub  { font-size: 12px; color: rgba(226,232,240,0.45); margin-top: 1px; }

    /* Heading */
    .heading {
      font-size: 20px; font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .subheading {
      font-size: 13.5px;
      color: rgba(226,232,240,0.5);
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0;
      color: rgba(255,255,255,0.2); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: rgba(255,255,255,0.08);
    }

    /* SSO Button */
    .btn-sso {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 13px 20px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      border: none; border-radius: 12px;
      color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(108,99,255,0.35);
      letter-spacing: -0.1px;
    }

    .btn-sso:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(108,99,255,0.5);
    }

    .btn-sso:active { transform: translateY(0); }

    .synology-icon {
      width: 22px; height: 22px;
      background: rgba(255,255,255,0.2);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
    }

    /* Error banner */
    .error-banner {
      background: rgba(255,77,109,0.12);
      border: 1px solid rgba(255,77,109,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #ff6b85;
      margin-bottom: 20px;
      display: none;
    }
    .error-banner.visible { display: block; }

    /* Footer */
    .footer {
      margin-top: 28px; text-align: center;
      font-size: 11.5px; color: rgba(255,255,255,0.2);
    }

    /* Lock icon */
    .lock-ring {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      background: rgba(108,99,255,0.1);
      border: 1px solid rgba(108,99,255,0.25);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="page">
    <div class="card">

      <div class="logo">
        <div class="logo-icon">⏱</div>
        <div>
          <div class="logo-text">CronDock</div>
          <div class="logo-sub">Cron Job Manager</div>
        </div>
      </div>

      <div id="error-banner" class="error-banner"></div>

      <div class="lock-ring">🔐</div>
      <div class="heading">Welcome back</div>
      <div class="subheading">Sign in with your {{ provider_name }} account to access the dashboard.</div>

      <a href="/auth/start" class="btn-sso" id="sso-btn">
        <div class="synology-icon">🔑</div>
        Sign in with {{ provider_name }}
      </a>

      <div class="footer">
        Secured with OpenID Connect &middot; {{ provider_name }}
      </div>
    </div>
  </div>

  <script>
    // Show error messages from callback
    const params = new URLSearchParams(location.search);
    const error = params.get('error');
    const detail = params.get('detail');
    const messages = {
      access_denied:    'Access was denied by the SSO provider.',
      state_mismatch:   'Security check failed. Please try again.',
      token_exchange:   'Token exchange failed.',
      invalid_token:    'Invalid response from SSO server.',
    };
    if (error && messages[error]) {
      const banner = document.getElementById('error-banner');
      let msg = '⚠ ' + messages[error];
      if (detail) msg += `<br><code style="font-size:11px;opacity:0.8;">${detail}</code>`;
      banner.innerHTML = msg;
      banner.classList.add('visible');
    }

    // Show loading state when SSO button is clicked
    document.getElementById('sso-btn').addEventListener('click', function() {
      this.innerHTML = '<span style="display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;"></span> Redirecting…';
    });
  </script>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
